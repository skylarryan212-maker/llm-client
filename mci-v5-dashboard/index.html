<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCI V5</title></head><body><p style="font-family:system-ui;padding:20px">Loading MCI V5…</p><script>(async()=>{let b='';for(let i=0;i<5;i++)b+=await fetch(`chunk${i}.txt`,{cache:'no-store'}).then(r=>r.text());const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<pre style="white-space:pre-wrap">'+e.stack+'</pre>')</script></body></html>
