<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MCI V5 Dashboard</title><style>body{margin:0;background:#0b0f14;color:#e8eef7;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:520px;padding:24px;border:1px solid #273142;border-radius:16px;background:#121821}small{color:#9aa8ba}</style></head><body><div class="load"><div class="card" id="s"><b>Loading MCI V5 dashboard…</b><br><br><small>This should only take a moment.</small></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw Error('This browser is too old to decompress the dashboard. Please use a current Safari or Chrome.');const parts=await Promise.all(Array.from({length:7},(_,i)=>fetch('payload'+i+'.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Missing dashboard data: '+r.status);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('s').innerHTML='<b>Could not load the MCI dashboard.</b><br><br><small>'+String(e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</small>'}})();</script></body></html>
